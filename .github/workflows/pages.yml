name: Github Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7

      - name: ⬢ Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🏗️ Build
        env:
          NODE_ENV: production
          FORCE_COLOR: 1
        run: |
          npm run build
          ./bin/postbuild.sh

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/client

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      id-token: write
      pages: write

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
